<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecondChance | Register</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="brand">SecondChance</div>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/main">Browse</a>
        <a href="/register">Register</a>
        <a href="/login">Login</a>
      </div>
      <div id="userBadge" class="user-badge">Guest</div>
    </nav>

    <main class="form-shell">
      <h1>Create an account</h1>
      <form id="registerForm" class="auth-form">
        <label>
          Username
          <input type="text" name="username" value="janeDoe" required />
        </label>
        <label>
          Email
          <input type="email" name="email" value="jane@example.com" required />
        </label>
        <label>
          Password
          <input type="password" name="password" value="mypassword123" required />
        </label>
        <button type="submit">Register</button>
      </form>
      <p id="registerMessage" class="message"></p>
    </main>

    <script src="/app.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        renderUserBadge();
        bindRegisterForm();
      });
    </script>
  </body>
</html>
